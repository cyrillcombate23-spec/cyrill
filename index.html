<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Fundamentals Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>User Greeting Generator</h2>
        
        <!-- Inputs for user name and age -->
        <label for="nameInput">Enter your Name:</label>
        <input type="text" id="nameInput" placeholder="e.g., Juan">

        <label for="ageInput">Enter your Age:</label>
        <input type="number" id="ageInput" placeholder="e.g., 20">

        <!-- Button to trigger the function -->
        <button onclick="generateUserGreeting()">Submit</button>

        <!-- Area to display the result -->
        <p id="output"></p>
    </div>

    <script>
        // Requirement: Uses a function to generate the greeting message.
        function createGreeting(name, age) {
            let greetingMessage = "";
            let userType = "";

            // Requirement: Determines whether the user is a minor or an adult using an if-else statement.
            if (age >= 18) {
                userType = "an adult";
            } else {
                userType = "a minor";
            }

            // Requirement: Personalized greeting including the minor/adult status.
            greetingMessage = `Hello, ${name}! You are ${age} years old, which means you are ${userType}.`;
            
            return greetingMessage;
        }

        // Main function triggered by the button click
        function generateUserGreeting() {
            // 1. Accepts a user's name and age
            let userName = document.getElementById("nameInput").value;
            let userAge = parseInt(document.getElementById("ageInput").value);

            // Basic validation to ensure fields aren't empty
            if (userName === "" || isNaN(userAge)) {
                document.getElementById("output").textContent = "Please enter both a valid name and age.";
                document.getElementById("output").style.color = "red";
                return;
            }

            // 2. Call the function to get the greeting message
            let finalMessage = createGreeting(userName, userAge);

            // 3. Displays the personalized greeting on the webpage
            document.getElementById("output").textContent = finalMessage;
            document.getElementById("output").style.color = "#333";
        }
    </script>

</body>it
</html>
